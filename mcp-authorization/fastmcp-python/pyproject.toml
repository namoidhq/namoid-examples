[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namoid-examples-mcp-authorization-fastmcp"
version = "0.1.0"
description = "Acme Finance MCP server protected by NamoID, built with FastMCP."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.5,<4",
    "httpx>=0.28",
    "pydantic>=2.11",
]

[tool.hatch.build.targets.wheel]
# Flat modules rather than a package: this is a server you run, not a library
# you import, and keeping the files at the top level makes them easy to copy
# into a real project.
include = ["namoid_mcp_auth.py", "demo_store.py", "server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
