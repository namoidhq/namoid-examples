[package]
name = "namoid-rust-axum-quickstart"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Sign in with NamoID (OAuth 2.1 + OIDC) from an axum app via Authorization Code + PKCE."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
openidconnect = "3"
reqwest = { version = "0.11", default-features = false, features = ["default-tls"] }
serde = { version = "1", features = ["derive"] }
tower-sessions = "0.12"
url = "2"
