name: namoid-examples

services:
  express-react:
    build:
      context: ./hosted-auth/express-react
    environment:
      APP_BASE_URL: ${EXPRESS_REACT_APP_URL:-http://localhost:3003}
      NAMOID_CLIENT_ID: ${EXPRESS_REACT_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${EXPRESS_REACT_NAMOID_CLIENT_SECRET:-}
      NODE_ENV: production
      PORT: 3003
      SESSION_SECRET: ${EXPRESS_REACT_SESSION_SECRET:-}
    ports:
      - "${EXPRESS_REACT_HOST_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3003/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  react-spa:
    build:
      context: ./hosted-auth/react-spa
      args:
        VITE_NAMOID_CLIENT_ID: ${SPA_NAMOID_CLIENT_ID:-}
    ports:
      - "${SPA_HOST_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nextjs:
    build:
      context: ./hosted-auth/nextjs
    environment:
      HOSTNAME: 0.0.0.0
      NAMOID_CLIENT_ID: ${NEXTJS_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${NEXTJS_NAMOID_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXTJS_APP_URL:-http://localhost:3001}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${NEXTJS_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nextjs-supabase:
    build:
      context: ./hosted-auth/nextjs-supabase
    environment:
      HOSTNAME: 0.0.0.0
      NAMOID_CLIENT_ID: ${SUPABASE_NEXTJS_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${SUPABASE_NEXTJS_NAMOID_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${SUPABASE_NEXTJS_APP_URL:-http://localhost:3002}
      NODE_ENV: production
      PORT: 3002
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports:
      - "${SUPABASE_NEXTJS_HOST_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
