name: namoid-examples

services:
  express-react:
    build:
      context: ./hosted-auth/express-react
    environment:
      APP_BASE_URL: ${EXPRESS_REACT_APP_URL:-http://localhost:3003}
      NAMOID_CLIENT_ID: ${EXPRESS_REACT_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${EXPRESS_REACT_NAMOID_CLIENT_SECRET:-}
      NODE_ENV: production
      PORT: 3003
      SESSION_SECRET: ${EXPRESS_REACT_SESSION_SECRET:-}
    ports:
      - "${EXPRESS_REACT_HOST_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3003/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  react-spa:
    build:
      context: ./hosted-auth/react-spa
      args:
        VITE_NAMOID_CLIENT_ID: ${SPA_NAMOID_CLIENT_ID:-}
    ports:
      - "${SPA_HOST_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nextjs:
    build:
      context: ./hosted-auth/nextjs
    environment:
      HOSTNAME: 0.0.0.0
      NAMOID_CLIENT_ID: ${NEXTJS_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${NEXTJS_NAMOID_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXTJS_APP_URL:-http://localhost:3001}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${NEXTJS_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp-express-ts:
    build:
      context: ./mcp-authorization/express-ts
    environment:
      NAMOID_ISSUER: ${MCP_EXPRESS_TS_NAMOID_ISSUER:-}
      NAMOID_MCP_RESOURCE: ${MCP_EXPRESS_TS_RESOURCE:-}
      NAMOID_MCP_RESOURCE_NAME: ${MCP_EXPRESS_TS_RESOURCE_NAME:-Acme Finance MCP}
      NODE_ENV: production
      PORT: 3004
    ports:
      - "${MCP_EXPRESS_TS_HOST_PORT:-3004}:3004"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp-fastmcp-python:
    build:
      context: ./mcp-authorization/fastmcp-python
    environment:
      NAMOID_ISSUER: ${MCP_FASTMCP_NAMOID_ISSUER:-}
      NAMOID_MCP_RESOURCE: ${MCP_FASTMCP_RESOURCE:-}
      NAMOID_MCP_RESOURCE_NAME: ${MCP_FASTMCP_RESOURCE_NAME:-Acme Finance MCP}
      PORT: 3005
    ports:
      - "${MCP_FASTMCP_HOST_PORT:-3005}:3005"
    healthcheck:
      # FastMCP serves no unauthenticated health route, so the protected-resource
      # metadata document doubles as the liveness probe.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.parse,urllib.request;
          p=urllib.parse.urlsplit(os.environ['NAMOID_MCP_RESOURCE']).path.rstrip('/');
          urllib.request.urlopen('http://127.0.0.1:3005/.well-known/oauth-protected-resource'+p,timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nextjs-supabase:
    build:
      context: ./hosted-auth/nextjs-supabase
    environment:
      HOSTNAME: 0.0.0.0
      NAMOID_CLIENT_ID: ${SUPABASE_NEXTJS_NAMOID_CLIENT_ID:-}
      NAMOID_CLIENT_SECRET: ${SUPABASE_NEXTJS_NAMOID_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${SUPABASE_NEXTJS_APP_URL:-http://localhost:3002}
      NODE_ENV: production
      PORT: 3002
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports:
      - "${SUPABASE_NEXTJS_HOST_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
